<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- page-head:start -->
    <!-- Replaced at build time by each page's own title, description,
         canonical, link-preview tags and structured data, all from
         src/seo/routes.ts (scripts/prerender.mjs). What is here only shows
         under `vite dev`. -->
    <title>Occupella | AI assistant for Buildium property managers</title>
    <!-- page-head:end -->
    <!-- THE BRAND MARK. These files are BYTE COPIES of the ones the app ships
         at app.occupella.com — the same relationship social-preview.png has
         always had. One product, one mark, on both hosts.

         ⚠ THEY MUST BE REPLACED IN BOTH REPOS TOGETHER. This site shipped a
         square-grid mark while the app shipped the wordmark for six days after
         the 2026-09-15 swap, because the wordmark change landed in the app repo
         and nothing carried it here — so the tab a prospect opened and the tab
         a customer opened showed two different companies. The app's own comment
         claimed "same mark as the marketing site" throughout. A comment cannot
         fail (authority-repo gotcha 48), and a fix that reaches one surface and
         not the other is gotcha 25's fan-out.

         ⚠ AND THE ICON WAS AN INLINE data: URI, which is why /favicon.ico was
         never missed. MEASURED 2026-09-21: https://occupella.com/favicon.ico
         answered 404 — a real 404, not the SPA shell, so the rewrite was
         innocent and the file simply was not there. Google's favicon crawler
         asks for that path by convention, got nothing, and rendered the domain
         with the generic globe in search while every other result on the page
         showed its mark. A data: URI cannot satisfy that request at any size.
         48px is in the .ico because Google resizes from a multiple of 48.

         Ordered .ico FIRST for that crawler; a modern browser still prefers
         the SVG below, because `sizes="any"` outranks a fixed-size raster. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <meta name="author" content="Oscar Ventures LLC" />
    <!-- ⚠ A PNG, not the SVG — this line USED to point at /favicon.svg and did
         nothing at all. iOS ignores an SVG apple-touch-icon entirely and
         screenshots the page instead, so a prospect who added the site to their
         home screen got a thumbnail of whatever they were looking at. It also
         paints BLACK behind transparency, which is why the plate in these files
         is what controls what an install actually shows. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Android Chrome refuses an SVG-only manifest for the home screen and
         substitutes a generated letter tile — somebody else's icon on the
         customer's phone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The browser chrome colour, NOT the icon's. White, matching this site's
         canvas and the app's (it was #0a0910 from the retired dark theme). -->
    <meta name="theme-color" content="#FFFFFF" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Legal-entity attribution for crawlers that don't execute JS (A2P/Twilio
         verification reads the served HTML). In a real browser the app renders
         its own footer, so this one is suppressed to avoid showing it twice. -->
    <noscript>
      <footer
        style="
          text-align: center;
          padding: 20px 32px 28px;
          font-size: 12px;
          color: #8a8a94;
          font-family: system-ui, sans-serif;
        "
      >
        Occupella is operated by Oscar Ventures LLC.
      </footer>
    </noscript>
  </body>
</html>
