<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The Occupella wordmark — the same word, the same typeface (Geist 600) and
    the same two colours as the first-paint shell in index.html, so the tab,
    the search result and the loading screen are one thing.

    ⚠ REPLACED A SQUARE-GRID MARK ON 2026-09-15, at the founder's call, and
    BOTH files had to change together. Browsers prefer this SVG over
    favicon.ico (`sizes="any"` outranks a fixed raster), so leaving the grid
    here and shipping a wordmark .ico would have put one mark in the tab and a
    different one in Google — the incoherence being fixed, re-created.

    ⚠ THE TEXT IS OUTLINES, NOT A <text> ELEMENT. A favicon renders in
    contexts with no CSS and no webfont — a browser tab, a bookmark bar, a
    crawler's rasteriser — and a <text> tag there falls back to whatever the
    host has, so the mark would silently become Times on somebody's machine.
    These paths are Geist 600 instanced from the variable font the app itself
    loads, so there is nothing left to resolve at render time.

    ⚠ THE WHITE PLATE IS LOAD-BEARING and is why there is no dark-mode
    variant. #0E1620 text on a transparent ground disappears against a dark
    tab strip; the plate is also exactly the loading screen's background, so
    honouring the brief and staying legible are the same decision here.

    ⚠ At 16px the word is about three pixels tall and reads as a dark smear.
    That is understood and accepted — the full word was the explicit ask, and
    Google prints the legible site name beside the icon anyway (the WebSite
    JSON-LD in index.html is what feeds it). favicon.ico carries the same
    artwork at 16/32/48.
  -->
